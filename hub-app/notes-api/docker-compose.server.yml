services:
  notes-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motion-notes-api
    restart: unless-stopped
    environment:
      - PORT=4001
      - NOTES_DATA_DIR=/app/data
    volumes:
      - /opt/motion/notes-data:/app/data
    expose:
      - "4001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: motion-notes-caddy
    restart: unless-stopped
    depends_on:
      - notes-api
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SYNC_DOMAIN=${SYNC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/motion/caddy_data:/data
      - /opt/motion/caddy_config:/config

