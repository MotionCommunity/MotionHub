services:
  postgres:
    image: postgres:16-alpine
    container_name: motion-league-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: motion
      POSTGRES_PASSWORD: motion
      POSTGRES_DB: motion_league
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: motion-league-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: motion-league-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: motion
      MINIO_ROOT_PASSWORD: motionsecret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
